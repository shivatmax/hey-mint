name: Release
# Push a tag like v0.1.0 to build Hey Mint.app on an Apple silicon runner and publish it
# as a GitHub Release: the DMG, its .sha256, and latest.json for the app's own updater.
#
# Signing (optional secrets; without them the app is signed ad hoc):
#   MACOS_CERT_P12       base64 of a .p12 with the signing certificate and its key
#   MACOS_CERT_PASSWORD  its password
#   MACOS_SIGN_IDENTITY  the certificate's SHA-1 (or its name)
# The free way: the self-signed "Hey Mint Release" certificate from packaging/make_release_cert.sh.
# Every release then has the same designated requirement, so an update keeps the Microphone,
# Accessibility and Screen Recording permissions (ad hoc, each build is a new app to macOS).
# With a paid Developer ID ("Developer ID Application: Name (TEAMID)") plus APPLE_ID,
# APPLE_TEAM_ID and APPLE_APP_PASSWORD (an app-specific password), it is also notarized.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  app:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {fetch-depth: 0}
      - name: Tools (the newest Xcode on the runner, portaudio)
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          echo "Using $newest"; xcrun swift --version; sw_vers
          brew install portaudio
      - name: Import the signing certificate
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.HAS_CERT == 'true'
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"     # stays unlocked through the build
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # codesign finds the identity (and a self-signed one's chain) through the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$keychain"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        if: env.HAS_NOTARY == 'true'
        run: xcrun notarytool store-credentials heymint --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build the app and DMG
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ env.HAS_NOTARY == 'true' && 'heymint' || '' }}
        run: |
          set +e
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "::notice title=build::macOS $(sw_vers -productVersion) $(uname -m), $(xcrun swift --version 2>&1 | head -1), python3 $(python3 --version 2>&1)"
          bash packaging/build_app.sh > build.log 2>&1
          status=$?
          cat build.log
          if [[ $status -ne 0 ]]; then
            echo "::error title=build::exit $status after $(wc -l < build.log | tr -d ' ') lines: $(tail -c 600 build.log | tr '\n\r' '  ' | sed 's/%/%25/g; s/::/: :/g')"
            tail -25 build.log | sed 's/%/%25/g' | while IFS= read -r line || [[ -n "$line" ]]; do echo "::error title=build::$line"; done
          fi
          exit $status
      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/latest.json
          generate_release_notes: true
          body: |
            ## Install (Apple silicon Mac, macOS 14.2 or later)
            **Already have Hey Mint? Don't download anything** - it updates itself (Settings ▸ Updates & Help).

            **Way 1 - download (no Terminal)**
            1. Download **Hey-Mint-…-arm64.dmg** below, open it and drag **Hey Mint** onto **Applications**.
            2. Open **Hey Mint** from Applications. macOS says *“Apple could not verify ‘Hey Mint’…”* - click **Done**.
            3. Open **System Settings ▸ Privacy & Security**, scroll down, click **Open Anyway** next to *“Hey Mint” was blocked*, type your Mac password, then **Open Anyway** again. (macOS 14: right-click Hey Mint ▸ **Open** ▸ **Open**.)

            That's once per Mac: new versions install themselves without asking. (Hey Mint is free; Apple only skips this question for developers who pay it a yearly fee.)

            **Way 2 - one line in Terminal (macOS asks nothing)**
            ```
            curl -fsSL https://raw.githubusercontent.com/shivatmax/hey-mint/main/packaging/install.sh | bash
            ```
            It downloads this release, checks its sha256, puts Hey Mint in Applications, approves it with macOS and opens it.

            **Then** paste your free [Gemini API key](https://aistudio.google.com/apikey) in the welcome window, allow the Microphone, and turn on Hey Mint under **Accessibility** when asked.

            Then say **“Hey Mint”**, or press ⌘J and type. The guide: https://hey-mint.pages.dev/
