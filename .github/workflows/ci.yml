name: CI
# Actions are pinned by commit SHA (the tag in the comment); Dependabot keeps them current.
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: macos-latest
    # A hung test or build fails the job in minutes, not after GitHub's 6-hour limit.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]    # pyproject.toml: requires-python >= 3.11
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - name: No secrets or personal files
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|custom\.json|settings\.json|agents\.json|history\.jsonl|memory\.md)$'
      - name: Install
        run: |
          brew install portaudio
          python -m pip install -r requirements.txt pytest ruff
      - name: Build the screen-control engine (Swift)
        run: cd launcher/engine && swift build -c release
      - name: Build the meeting recorder
        run: swiftc -O launcher/recorder/*.swift -o /tmp/MintRecorder -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker launcher/recorder/Info.plist
      - name: Build the screen recorder
        run: swiftc -O launcher/screenrec/*.swift -o /tmp/MintScreen -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker launcher/screenrec/Info.plist
      - name: Lint (syntax errors, undefined names)
        run: ruff check mint tests
      - name: Offline checks
        run: |
          set +e
          python -m pytest -rfE -q > pytest.log 2>&1
          status=$?
          cat pytest.log
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while IFS= read -r line || [[ -n "$line" ]]; do
            echo "::error title=pytest::$(echo "$line" | cut -c1-600 | sed 's/%/%25/g; s/::/: :/g')"
          done
          exit $status
