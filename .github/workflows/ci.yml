name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Byte-compile everything
        run: python -m compileall -q mint bench guide launcher
      - name: No secrets or personal files
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|custom\.json|settings\.json|history\.jsonl|memory\.md)$'
